# Push a tag like v0.3.0 (matching "version" in src-tauri/tauri.conf.json) and this
# builds the signed Windows installer plus latest.json, which the in-app updater reads
# from https://github.com/vxnsin/voidtrace/releases/latest/download/latest.json.
# Needs the repo secret TAURI_SIGNING_PRIVATE_KEY (contents of the .key file).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VoidTrace ${{ github.ref_name }}
          releaseBody: Install with the setup .exe below; installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
