<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" width="620" height="170" role="img" aria-label="VoidTrace">
  <style>
    .word tspan { opacity: 0; animation: on .01s steps(1) forwards; }
    .sub { opacity: 0; animation: fade .6s ease 1.4s forwards; }
    .trace { stroke-dasharray: 430; stroke-dashoffset: 430; animation: draw 1.1s ease-out .2s forwards; }
    .wedge { animation: pulse 4s ease-in-out 1.6s infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes on { to { opacity: 1; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 80%, 100% { opacity: 1; } 88% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <svg x="8" y="13" width="144" height="144" viewBox="0 0 1024 1024">
