<html lang="en">

    <script>

      // before any app code runs; a dark page there is a black screen over the game.
      if (location.hash.startsWith("#/overlay")) document.documentElement.classList.add("overlay");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidTrace</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
