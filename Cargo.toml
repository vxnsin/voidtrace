[workspace]
resolver = "2"
members = ["crates/wfc-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"

# The memory scan walks several GB; keep it fast in dev builds too.
[profile.dev.package.wfc-core]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
